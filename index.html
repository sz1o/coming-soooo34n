<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    @font-face {
      font-family: 'OldRobloxFont';
      src: url('OldRobloxFont-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: url('old-mousey45yt54.png'), default !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    body {
      background-image: url('backr0und.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      gap: 16px;
    }

    .logo {
      width: clamp(160px, 25vw, 320px);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.45));
    }

    .coming-soon-text {
      font-family: 'OldRobloxFont', sans-serif;
      color: #ffffff;
      font-size: clamp(3rem, 7vw, 6rem);
      letter-spacing: 2px;
      text-shadow: 
        0 4px 12px rgba(0, 0, 0, 0.75),
        0 2px 4px rgba(0, 0, 0, 0.9);
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="roblox-log342324234342o.png" alt="" class="logo">
    <h1 class="coming-soon-text">Coming Soon.</h1>
  </div>

</body>
</html>
